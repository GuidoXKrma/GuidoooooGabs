apiVersion: apps/v1
kind: Deployment
metadata:
  name: monolito
  namespace: mini-proyecto
spec:
  replicas: 1
  selector:
    matchLabels: {app: monolito}
  template:
    metadata:
      labels: {app: monolito}
    spec:
      containers:
        - name: monolito
          image: mini-proyecto-monolito:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 3000}]
---
apiVersion: v1
kind: Service
metadata:
  name: monolito
  namespace: mini-proyecto
spec:
  selector: {app: monolito}
  ports: [{port: 3000, targetPort: 3000}]
